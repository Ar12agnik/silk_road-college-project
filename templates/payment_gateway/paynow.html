<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirm Your Details</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.1.0/fonts/remixicon.css" rel="stylesheet" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins&display=swap');
    body {
      background-color: #f8f9fa;
      font-family: 'Poppins', sans-serif;
    }

    .container {
      margin-top: 50px;
      max-width: 700px;
      background-color: #ffffff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
    }

    h3 {
      text-align: center;
      margin-bottom: 30px;
      font-weight: bold;
      color: #343a40;
    }

    h5 {
      font-size: 1.2rem;
      color: #495057;
      margin-bottom: 15px;
      font-weight: bold;
    }

    p {
      font-size: 1rem;
      color: #6c757d;
      margin-bottom: 10px;
    }

    .btn {
      font-size: 1rem;
      font-weight: bold;
      padding: 10px 20px;
      border-radius: 5px;
    }

    .btn-danger {
      background-color: #dc3545;
      border: none;
    }

    .btn-danger:hover {
      background-color: #bd2130;
    }

    .btn-success {
      background-color: #28a745;
      border: none;
    }

    .btn-success:hover {
      background-color: #218838;
    }

    .row {
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

<div class="container">
  <h3>Confirm your details <i class="ri-file-list-2-line"></i></h3>
  <div class="row">
    <div class="col-md-6">
      <h5>Personal Information</h5>
      <p><strong>Email:</strong> {{email}}</p>
      <p><strong>Phone:</strong> {{mobile}}</p>
    </div>
    <div class="col-md-6">
      <h5>Shipping Address</h5>
      <p><strong>Address:</strong> {{address}}</p>
      <p><strong>Amount:</strong> ₹{{amount}}</p>
    </div>
  </div>
  <div class="row">
    <div class="col-md-12 text-center">
      <button class="btn btn-danger mr-2" onclick="goBack()"><i class="ri-arrow-left-circle-line"></i> Go Back</button>
      <button class="btn btn-success" id="rzp-button1">Pay Now <i class="ri-bank-card-line"></i></button>
    </div>
  </div>
</div>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
  function goBack() {
    window.history.back();
  }

  var options = {
    "key": "rzp_test_8LqnCVttuKmh8F",
    "amount": "{{payment.amount}}",
    "currency": "INR",
    "name": "DevVendors",
    "description": "Grossey",
    "image": "https://example.com/your_logo",
    "order_id": "{{payment.id}}",
    "handler": function (response) {
      window.location.href = `payment-success/?razorpay_payment_id=${response.razorpay_payment_id}&razorpay_order_id=${response.razorpay_order_id}&razorpay_signature=${response.razorpay_signature}`;
    },
    "notes": {
      "address": "Razorpay Corporate Office"
    },
    "theme": {
      "color": "#3399cc"
    }
  };
  var rzp1 = new Razorpay(options);
  rzp1.on('payment.failed', function (response) {
    alert(response.error.code);
    alert(response.error.description);
    alert(response.error.source);
    alert(response.error.step);
    alert(response.error.reason);
    alert(response.error.metadata.order_id);
    alert(response.error.metadata.payment_id);
  });
  document.getElementById('rzp-button1').onclick = function (e) {
    rzp1.open();
    e.preventDefault();
  };
</script>

</body>
</html>
