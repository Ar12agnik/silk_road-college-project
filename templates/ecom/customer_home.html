{% include 'ecom/customer_navbar.html' %}
{% load static %}
{% block content %}

{% if products %}
<link href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body {
    margin: 0;
    padding: 0;
    background-color: white;
  }



* {
	margin: 0;
	padding: 0;
	box-sizing: border-box;
	scroll-padding-top: 2rem;
	scroll-behavior: smooth;
}

:root {
	--text-color: #171427;
	--bg-color: #fff;
}

body {
	font-family: 'Poppins', sans-serif;
	color: var(--text-color);
	font-weight: 400;
}

.shop-content {
	display: grid;
	grid-template-columns: repeat(auto-fit, minmax(220px, auto));
	gap: 1.6rem;
}
a{
text-decoration: none;
color: rgb(0, 110, 0);
font-weight: lighter;
}
a:hover{
	color: black;
	
}
.product-img {
	width: 100%;
	height: 300px;
	margin-bottom: 0.5rem;
	object-fit: cover;
	border-radius: 10px;
	transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.product-img:hover {
	cursor: pointer;
	box-shadow: rgba(0, 0, 0, 0.16) 0px 1px 4px;
}


.product-title {
	font-size: 1rem;
	margin-bottom: 0.5rem;
	letter-spacing: 1;

}
.product-title:hover{
	color: #00610E;

}
.price {
	color: #e73838;
}
.price:hover{
	color: #af0909;
}
.add-cart {
	position: absolute;
	bottom: 0;
	right: 0;
	background-color: #00610E;
	color: var(--bg-color);
	padding: 10px;
	cursor: pointer;
	transition: background-color 0.3s;
}

.add-cart:hover {
	background-color: #00610E;
}

</style>

<h4 style="text-align:center; color:#3E454C;">{{ word }}</h4>


<section class="container-fluid px-4 py-4">
  <div class="shop-content">
    {% for p in products %}
    
    <div class="product-box">
       <a href="{% url 'product detailes' p.id %}" style="text-decoration: none;">
      <img src="{% static p.product_image.url %}" alt="{{ p.name }}" class="product-img">
      <h2 class="product-title">{{ p.name }}</h2>
      <span class="price">₹ {{ p.price }}</span>
      <a href="{% url 'add-to-cart' p.id %}">
      <i class='bx bx-shopping-bag add-cart'></i></a>
    </div>
{% endfor %}

</section>

{% else %}
<h3 style="text-align:center; color:#3E454C;">No Search Found</h3>
{% endif %}

{% include "ecom/footer.html" %}
<script>
  {% if messages %}
  {% for message in messages %}
  alert('{{ message }}');
  {% endfor %}
  {% endif %}


</script>

{% endblock content %}
